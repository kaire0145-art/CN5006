<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Enrollment Form</title>
</head>
<body style="background-color: beige;">
<h2>Student Details</h2>

<form action="/submit-data" method="post">

    First Name:
    <input name="firstName" type="text" required>
    <br><br>

    Last Name:
    <input name="lastName" type="text" required>
    <br><br>

    Email:
    <input name="email" type="email" required>
    <br><br>

    Age:
    <input name="myAge" type="number" required>
    <br><br>

    <p>Please select your gender:</p>

    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label><br>

    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br>

    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label>

    <p>Qualifications</p>

    <input type="checkbox" name="Qual" value="GCSE"> GCSE<br>
    <input type="checkbox" name="Qual" value="A-level"> A-level<br>
    <input type="checkbox" name="Qual" value="HNC"> Higher National Certificate / Level 4<br>
    <input type="checkbox" name="Qual" value="HND"> Foundation Degree / HND / Level 5<br>
    <input type="checkbox" name="Qual" value="BSc"> Bachelor's Degree / Level 6<br>
    <input type="checkbox" name="Qual" value="Master Degree"> Master's Degree / Level 7<br>
    <input type="checkbox" name="Qual" value="PhD"> PhD / Level 8<br><br>

    <input type="submit" value="Submit Student Details">

</form>
</body>
</html>
